<meta charset="UTF-8">

<title>閉まらないで！ エレベーター連打ゲーム</title>
<style>
  :root {
    --steel-dark: #2a2c2e;
    --panel-light: #9a9d9f;
    --panel-dark: #55575a;
    --amber: #ff8c1a;
    --amber-glow: #ffb347;
    --led-green: #3dff8f;
    --danger: #ff3b3b;
    --bg: #16171a;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    font-family: 'Courier New', monospace;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }

  .wrap {
    width: 100%;
    max-width: 460px;
    padding: 18px;
  }

  /* ---- Floor indicator ---- */
  .indicator {
    background: #0c0d0e;
    border: 3px solid #3a3c3e;
    border-radius: 6px;
    padding: 10px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
    box-shadow: inset 0 0 12px rgba(0,0,0,0.8);
  }

  .indicator .label {
    color: #666;
    font-size: 11px;
    letter-spacing: 2px;
  }

  .indicator .value {
    color: var(--led-green);
    font-size: 26px;
    font-weight: bold;
    text-shadow: 0 0 8px rgba(61,255,143,0.7);
    letter-spacing: 2px;
    font-variant-numeric: tabular-nums;
  }

  .indicator .value.danger {
    color: var(--danger);
    text-shadow: 0 0 10px rgba(255,59,59,0.8);
  }

  /* ---- Elevator shaft / door assembly ---- */
  .shaft {
    position: relative;
    width: 100%;
    aspect-ratio: 3 / 4;
    background: repeating-linear-gradient(
      90deg,
      #1a1a1c 0px, #1a1a1c 2px,
      #0f0f10 2px, #0f0f10 4px
    );
    border-radius: 4px;
    overflow: hidden;
    border: 4px solid #3f4143;
    box-shadow: 0 0 0 2px #1c1d1e, 0 18px 40px rgba(0,0,0,0.6);
  }

  .shaft.shake {
    animation: shake 0.25s ease-in-out;
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-3px); }
    75% { transform: translateX(3px); }
  }

  .door {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 50%;
    background:
      linear-gradient(180deg, rgba(255,255,255,0.08), rgba(0,0,0,0.15) 40%, rgba(0,0,0,0.3)),
      linear-gradient(90deg, var(--panel-light), var(--panel-dark) 55%, var(--panel-light));
    box-shadow: inset 0 0 20px rgba(0,0,0,0.35);
    transition: none;
  }

  .door::before {
    /* brushed metal grain */
    content: "";
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      180deg,
      rgba(255,255,255,0.03) 0px,
      rgba(255,255,255,0.03) 1px,
      rgba(0,0,0,0.02) 1px,
      rgba(0,0,0,0.02) 2px
    );
  }

  .door::after {
    content: "";
    position: absolute;
    top: 0; bottom: 0;
    width: 3px;
    background: linear-gradient(180deg, #222, #000 50%, #222);
  }

  .door.left { left: 0; }
  .door.left::after { right: 0; }
  .door.right { right: 0; }
  .door.right::after { left: 0; }

  .door-handle {
    position: absolute;
    top: 50%;
    width: 8px;
    height: 60px;
    background: linear-gradient(90deg, #444, #888, #444);
    border-radius: 3px;
    transform: translateY(-50%);
  }
  .door.left .door-handle { right: 10px; }
  .door.right .door-handle { left: 10px; }

  .gap-glow {
    position: absolute;
    top: 0; bottom: 0; left: 50%;
    width: 6px;
    transform: translateX(-50%);
    background: radial-gradient(circle, rgba(255,180,80,0.9), rgba(255,180,80,0) 70%);
    filter: blur(2px);
    pointer-events: none;
  }

  .overlay-msg {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: rgba(0,0,0,0.55);
    color: #fff;
    text-align: center;
    padding: 20px;
  }
  .overlay-msg.show { display: flex; }
  .overlay-msg h2 {
    margin: 0;
    font-size: 22px;
    color: var(--danger);
    text-shadow: 0 0 10px rgba(255,59,59,0.8);
  }
  .overlay-msg p {
    margin: 0;
    font-size: 14px;
    color: #ddd;
  }
  .overlay-msg .best {
    color: var(--amber-glow);
    font-size: 13px;
  }

  /* ---- Controls ---- */
  .controls {
    margin-top: 18px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }

  .open-btn {
    width: 150px;
    height: 150px;
    border-radius: 50%;
    border: none;
    background: radial-gradient(circle at 35% 30%, var(--amber-glow), var(--amber) 55%, #b35d00 100%);
    box-shadow:
      0 8px 0 #7a3f00,
      0 12px 20px rgba(0,0,0,0.5),
      inset 0 3px 6px rgba(255,255,255,0.4);
    color: #2a1400;
    font-size: 15px;
    font-weight: bold;
    letter-spacing: 4px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    transition: transform 0.05s ease, box-shadow 0.05s ease;
  }
  .open-btn svg {
    width: 34px;
    height: 34px;
  }
  .open-btn:active {
    transform: translateY(6px);
    box-shadow:
      0 2px 0 #7a3f00,
      0 4px 8px rgba(0,0,0,0.5),
      inset 0 3px 6px rgba(255,255,255,0.3);
  }
  .open-btn:disabled {
    filter: grayscale(0.8) brightness(0.6);
    cursor: default;
  }

  .stats {
    display: flex;
    gap: 18px;
    color: #888;
    font-size: 12px;
    letter-spacing: 1px;
  }
  .stats span { color: var(--amber-glow); }

  .hint {
    margin-top: 4px;
    color: #666;
    font-size: 11px;
    text-align: center;
    line-height: 1.6;
  }

  .restart-btn {
    margin-top: 4px;
    padding: 10px 22px;
    background: #3a3c3e;
    color: #eee;
    border: 1px solid #55575a;
    border-radius: 6px;
    font-family: inherit;
    font-size: 13px;
    letter-spacing: 1px;
    cursor: pointer;
  }
  .restart-btn:hover { background: #47494b; }
</style>
</head>
<body>

<div class="wrap">
  <div class="indicator">
    <span class="label">DOOR STATUS</span>
    <span class="value" id="doorValue">OPEN 100%</span>
  </div>

  <div class="shaft" id="shaft">
    <div class="gap-glow" id="gapGlow"></div>
    <div class="door left" id="doorLeft"><div class="door-handle"></div></div>
    <div class="door right" id="doorRight"><div class="door-handle"></div></div>

    <div class="overlay-msg" id="overlayMsg">
      <h2>扉が閉まった…</h2>
      <p id="resultText">生存時間: 0.0秒 / 連打数: 0</p>
      <p class="best" id="bestText">ベスト: 0.0秒</p>
      <button class="restart-btn" id="restartBtn">もう一度挑戦</button>
    </div>
  </div>

  <div class="controls">
    <button class="open-btn" id="openBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="#2a1400" stroke-width="2.5">
        <path d="M8 5l-6 7 6 7M16 5l6 7-6 7" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      連打！
    </button>
    <div class="stats">
      <div>時間: <span id="timeStat">0.0</span>s</div>
      <div>連打: <span id="pressStat">0</span></div>
      <div>ベスト: <span id="bestStat">0.0</span>s</div>
    </div>
    <div class="hint">扉は自動で閉まっていきます。<br>ボタンを連打して開き続け、できるだけ長く生き延びよう。</div>
  </div>
</div>

<script>
(() => {
  const doorLeft = document.getElementById('doorLeft');
  const doorRight = document.getElementById('doorRight');
  const doorValue = document.getElementById('doorValue');
  const openBtn = document.getElementById('openBtn');
  const shaft = document.getElementById('shaft');
  const gapGlow = document.getElementById('gapGlow');
  const overlayMsg = document.getElementById('overlayMsg');
  const resultText = document.getElementById('resultText');
  const bestText = document.getElementById('bestText');
  const restartBtn = document.getElementById('restartBtn');
  const timeStat = document.getElementById('timeStat');
  const pressStat = document.getElementById('pressStat');
  const bestStat = document.getElementById('bestStat');

  const MAX_WIDTH = 50; // % width each door occupies when fully closed
  const CLOSE_RATE_PER_SEC = 6; // % per second doors close on their own
  const PUSH_PER_PRESS = 3.2; // % opened back per button press

  let openness = 100; // 100 = fully open, 0 = fully closed
  let doorPct = () => (100 - openness) / 100 * MAX_WIDTH;

  let running = false;
  let startTime = 0;
  let elapsed = 0;
  let presses = 0;
  let best = parseFloat(localStorage.getItem('elevatorBest') || '0');
  let lastFrame = 0;
  let rafId = null;

  bestStat.textContent = best.toFixed(1);

  function render() {
    const pct = doorPct();
    doorLeft.style.width = pct + '%';
    doorRight.style.width = pct + '%';
    const openPctDisplay = Math.max(0, Math.round(openness));
    doorValue.textContent = (openPctDisplay <= 15 ? 'DANGER ' : 'OPEN ') + openPctDisplay + '%';
    doorValue.classList.toggle('danger', openPctDisplay <= 25);
    const gapWidth = Math.max(0, (100 - pct * 2));
    gapGlow.style.opacity = openness < 40 ? (1 - openness/40) * 0.8 : 0;
  }

  function tick(ts) {
    if (!running) return;
    if (!lastFrame) lastFrame = ts;
    const dt = (ts - lastFrame) / 1000;
    lastFrame = ts;

    openness -= CLOSE_RATE_PER_SEC * dt;
    elapsed = (ts - startTime) / 1000;
    timeStat.textContent = elapsed.toFixed(1);

    if (openness <= 0) {
      openness = 0;
      render();
      endGame();
      return;
    }

    render();
    rafId = requestAnimationFrame(tick);
  }

  function startGame() {
    openness = 100;
    presses = 0;
    elapsed = 0;
    lastFrame = 0;
    running = true;
    overlayMsg.classList.remove('show');
    openBtn.disabled = false;
    pressStat.textContent = '0';
    timeStat.textContent = '0.0';
    render();
    startTime = performance.now();
    rafId = requestAnimationFrame(tick);
  }

  function endGame() {
    running = false;
    if (rafId) cancelAnimationFrame(rafId);
    openBtn.disabled = true;
    shaft.classList.add('shake');
    setTimeout(() => shaft.classList.remove('shake'), 250);

    if (elapsed > best) {
      best = elapsed;
      localStorage.setItem('elevatorBest', best.toFixed(2));
    }
    bestStat.textContent = best.toFixed(1);
    resultText.textContent = `生存時間: ${elapsed.toFixed(1)}秒 / 連打数: ${presses}`;
    bestText.textContent = `ベスト: ${best.toFixed(1)}秒`;
    overlayMsg.classList.add('show');
  }

  function press() {
    if (!running) return;
    openness = Math.min(100, openness + PUSH_PER_PRESS);
    presses++;
    pressStat.textContent = presses;
    render();
  }

  openBtn.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    press();
  });

  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.key === 'Enter') {
      e.preventDefault();
      press();
    }
  });

  restartBtn.addEventListener('click', startGame);

  render();
  startGame();
})();
</script>

</body>

    doorValue.classList.toggle('danger', openPctDisplay <= 25);
    const gapWidth = Math.max(0, (100 - pct * 2));
    gapGlow.style.opacity = openness < 40 ? (1 - openness/40) * 0.8 : 0;
  }

  function tick(ts) {
    if (!running) return;
    if (!lastFrame) lastFrame = ts;
    const dt = (ts - lastFrame) / 1000;
    lastFrame = ts;

    openness -= CLOSE_RATE_PER_SEC * dt;
    elapsed = (ts - startTime) / 1000;
    timeStat.textContent = elapsed.toFixed(1);

    if (openness <= 0) {
      openness = 0;
      render();
      endGame();
      return;
    }

    render();
    rafId = requestAnimationFrame(tick);
  }

  function startGame() {
    openness = 100;
    presses = 0;
    elapsed = 0;
    lastFrame = 0;
    running = true;
    overlayMsg.classList.remove('show');
    openBtn.disabled = false;
    pressStat.textContent = '0';
    timeStat.textContent = '0.0';
    render();
    startTime = performance.now();
    rafId = requestAnimationFrame(tick);
  }

  function endGame() {
    running = false;
    if (rafId) cancelAnimationFrame(rafId);
    openBtn.disabled = true;
    shaft.classList.add('shake');
    setTimeout(() => shaft.classList.remove('shake'), 250);

    if (elapsed > best) {
      best = elapsed;
      localStorage.setItem('elevatorBest', best.toFixed(2));
    }
    bestStat.textContent = best.toFixed(1);
    resultText.textContent = `生存時間: ${elapsed.toFixed(1)}秒 / 連打数: ${presses}`;
    bestText.textContent = `ベスト: ${best.toFixed(1)}秒`;
    overlayMsg.classList.add('show');
  }

  function press() {
    if (!running) return;
    openness = Math.min(100, openness + PUSH_PER_PRESS);
    presses++;
    pressStat.textContent = presses;
    render();
  }

  openBtn.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    press();
  });

  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.key === 'Enter') {
      e.preventDefault();
      press();
    }
  });

  restartBtn.addEventListener('click', startGame);

  render();
  startGame();
})();
</script>

</body>
</html>
